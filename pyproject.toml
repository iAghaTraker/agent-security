[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-security"
version = "1.0.0"
description = "Telegram alerting daemon for server events (SSH, systemd, filesystem, fail2ban, CrowdSec, dangerous commands)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "iAghaTraker Proprietary License 1.0" }
keywords = ["security", "telegram", "alerting", "fail2ban", "crowdsec", "auditd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
# Standard library only — no runtime dependencies.
dependencies = []

[project.scripts]
agent-security = "alertbot.__main__:main"

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[tool.setuptools]
# Flat layout: the package lives at the repo root.
packages = [
    "alertbot",
    "alertbot.approval",
    "alertbot.monitors",
]
include-package-data = true

[tool.setuptools.package-data]
alertbot = ["requirements.txt"]
